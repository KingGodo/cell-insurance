<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "Instrument Sans"; src: url("../fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400; }
@font-face { font-family: "Instrument Sans"; src: url("../fonts/InstrumentSans-SemiBold.ttf") format("truetype"); font-weight: 600; }
html { background: #121212; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #121212; font-family: "Instrument Sans", sans-serif;
  display: flex;
}
.wrap { margin: 36pt 44pt 32pt; width: 632pt; display: flex; flex-direction: column; justify-content: space-between; }
h1 { color: #F6F4EB; font-size: 40pt; font-weight: 600; margin: 0; line-height: 1.05; }
.kicker { color: #EBC831; font-size: 12pt; font-weight: 600; letter-spacing: 1.5pt; margin: 0; }
.sub { color: #EADEB2; font-size: 18pt; margin: 14pt 0 0; }
.bar { width: 64pt; height: 6pt; background: #EBC831; border-radius: 3pt; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">CUSTOMERIQ</p>
    <div>
      <h1>Keep the client you already have.</h1>
      <p class="sub">Profile them early. Intervene before they leave.</p>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
